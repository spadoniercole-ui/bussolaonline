# Blueprint Render — Bussola Residence (dati su database gestito Turso/libSQL)
# Con un database gestito non serve il disco: il web può restare sul piano free.
services:
  - type: web
    name: bussola-residence
    runtime: node
    region: frankfurt            # data center in UE (GDPR)
    plan: free                   # con Turso il disco non serve; scegli 'starter' per evitare i risvegli lenti
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: TURSO_DATABASE_URL  # es. libsql://<db>-<org>.turso.io  (dal pannello Turso)
        sync: false
      - key: TURSO_AUTH_TOKEN    # token del database Turso
        sync: false
      - key: ADMIN_PASSWORD      # password del gestore
        sync: false
      - key: STAFF_PASSWORD      # password dell'account staff
        sync: false
      - key: KOINE_ENC_KEY       # chiave di cifratura dati host (AES-256-GCM) — CRITICA: se persa, i dati host non sono recuperabili
        sync: false
      # Posta: senza queste, i codici di accesso NON partono (restano nei log del server).
      - key: MAIL_PROVIDER
        value: resend
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Bussola Residence <noreply@bussolavillage.it>
